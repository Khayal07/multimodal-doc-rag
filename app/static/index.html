<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multimodal RAG — Canlı Test</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent2: #818cf8;
    --ok: #4ade80;
    --warn: #fbbf24;
    --err: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 12px; font-size: 15px; text-transform: uppercase; letter-spacing: .5px; color: var(--accent); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], textarea, select, input[type=number] {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px;
  }
  textarea { resize: vertical; min-height: 70px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  .row > div { flex: 1; min-width: 120px; }
  button {
    background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #0f172a;
    border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
    margin-top: 12px;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; padding: 6px 12px; border-radius: 20px; background: var(--card); border: 1px solid var(--border); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.err { background: var(--err); }
  .answer { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .answer p:first-child { margin-top: 0; } .answer p:last-child { margin-bottom: 0; }
  .cite { background: rgba(250,204,21,.18); color: #fde047; border: 1px solid rgba(250,204,21,.35); border-radius: 6px; padding: 1px 5px; font-size: .9em; white-space: nowrap; }
  .tbl { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  .tbl th, .tbl td { border: 1px solid var(--border); padding: 5px 8px; text-align: left; }
  .tbl th { background: var(--card); }
  .sources { list-style: none; margin: 0; padding: 0; }
  .sources li { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; margin-right: 6px; }
  .b-table { background: rgba(56,189,248,.15); color: var(--accent); }
  .b-text { background: rgba(74,222,128,.15); color: var(--ok); }
  .b-heading { background: rgba(251,191,36,.15); color: var(--warn); }
  .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  pre.snippet { white-space: pre-wrap; font-size: 12px; color: var(--text); margin: 8px 0 0; max-height: 120px; overflow: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; color: var(--accent2); }
  .report { font-size: 14px; }
  .report b { color: var(--accent); }
  .error { color: var(--err); font-size: 14px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  footer { color: var(--muted); font-size: 12px; margin-top: 24px; text-align: center; }
  pre, code { font-family: Consolas, monospace; }
  code { background: var(--bg); padding: 1px 5px; border-radius: 5px; }
  pre code { padding: 8px; display: block; overflow: auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>📄 Multimodal RAG — Canlı Test</h1>
      <div class="sub">PDF yüklə → sual ver → sitatlı cavabı gör</div>
    </div>
    <div class="status" id="healthStatus"><span class="dot" id="healthDot"></span><span id="healthText">Yoxlanılır...</span></div>
  </header>

  <!-- YÜKLƏ -->
  <section class="card">
    <h2>1 · PDF Yüklə</h2>
    <label for="fileInput">PDF faylı seç (maks 25 MB)</label>
    <div class="row">
      <div>
        <input type="file" id="fileInput" accept="application/pdf">
      </div>
      <div>
        <button id="uploadBtn" disabled>Yüklə və İndekslə</button>
      </div>
    </div>
    <div id="uploadResult" class="hidden report"></div>
  </section>

  <!-- SORĞU -->
  <section class="card">
    <h2>2 · Sual Ver</h2>
    <label for="queryInput">Sualın</label>
    <textarea id="queryInput" placeholder="Məsələn: ResNet-in VGG-dən əsas fərqi nədir?"></textarea>
    <div class="row">
      <div>
        <label for="topK">Götürülən bölmə sayı (top-k)</label>
        <input type="number" id="topK" min="1" max="50" value="5">
      </div>
      <div>
        <label for="docFilter">Sənəd (seçməsən bütün)</label>
        <select id="docFilter"><option value="">Bütün sənədlər</option></select>
      </div>
    </div>
    <button id="queryBtn">Soruş</button>
    <div id="queryResult" class="hidden">
      <h2 style="margin-top:16px;">Cavab</h2>
      <div class="answer" id="answerBox"></div>
      <div id="citations" class="chips"></div>
      <h2 style="margin-top:16px;">Mənbələr</h2>
      <ul class="sources" id="sourcesList"></ul>
    </div>
  </section>

  <footer>Server: <code>http://127.0.0.1:8000</code> · API: <code>/api/v1/ingest/pdf</code>, <code>/api/v1/query</code></footer>
</div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);

/* ---------- minimarkdown ---------- */
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function inline(s) {
  s = escapeHtml(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function renderTable(rows) {
  let html = '<table class="tbl"><tbody>';
  rows.forEach((r, i) => {
    if (i === 1 && r.split("|").every(c => /^:?-+:?$/.test(c.trim()))) return;
    const cells = r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());
    const tag = i === 0 ? "th" : "td";
    html += "<tr>" + cells.map(c => `<${tag}>${inline(c)}</${tag}>`).join("") + "</tr>";
  });
  return html + "</tbody></table>";
}
function renderMarkdown(md) {
  const lines = md.split("\n");
  let html = "", i = 0, inCode = false, codeBuf = [];
  while (i < lines.length) {
    const line = lines[i];
    if (line.trim().startsWith("```")) {
      if (!inCode) { inCode = true; codeBuf = []; }
      else { inCode = false; html += "<pre><code>" + codeBuf.join("\n") + "</code></pre>"; }
      i++; continue;
    }
    if (inCode) { codeBuf.push(line); i++; continue; }
    if (/^\s*\|/.test(line)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(lines[i].trim()); i++; }
      html += renderTable(rows) + "<p></p>"; continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { const lvl = h[1].length; html += `<h${lvl}>${inline(h[2])}</h${lvl}>`; i++; continue; }
    if (/^\s*[-*]\s+/.test(line) || /^\s*\d+\.\s+/.test(line)) {
      const m = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)$/);
      html += `<ul><li>${inline(m[1])}</li></ul>`; i++; continue;
    }
    if (/^\s*---+\s*$/.test(line)) { html += "<hr>"; i++; continue; }
    if (!line.trim()) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^\s*\|/.test(lines[i]) &&
           !/^#{1,6}\s/.test(lines[i].trim()) && !/^\s*[-*]\s/.test(lines[i]) &&
           !/^\s*\d+\.\s/.test(lines[i]) && !lines[i].trim().startsWith("```")) {
      buf.push(lines[i].trim()); i++;
    }
    html += "<p>" + inline(buf.join(" ")) + "</p>";
  }
  return html;
}
function highlightCitations(html) {
  return html.replace(/\[Source:[^\]]*\]/g, m => `<span class="cite">${m}</span>`);
}

/* ---------- health ---------- */
async function refreshHealth() {
  try {
    const h = await fetch("/health").then(r => r.json());
    setHealth(true, `${h.vector_db} · ${h.chunks_indexed} chunk · ${h.documents.length} sənəd`);
    const sel = $("docFilter");
    const current = sel.value;
    sel.innerHTML = '<option value="">Bütün sənədlər</option>' +
      h.documents.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join("");
    sel.value = current;
  } catch (e) {
    setHealth(false, "Serverə qoşulmaq olmur");
  }
}
function setHealth(ok, text) {
  $("healthDot").className = "dot " + (ok ? "ok" : "err");
  $("healthText").textContent = text;
}

/* ---------- upload ---------- */
$("fileInput").addEventListener("change", () => {
  $("uploadBtn").disabled = !$("fileInput").files.length;
});
$("uploadBtn").addEventListener("click", async () => {
  const file = $("fileInput").files[0];
  if (!file) return;
  const btn = $("uploadBtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Parse edilir (10-60 san)...';
  $("uploadResult").classList.add("hidden");
  const fd = new FormData();
  fd.append("file", file);
  try {
    const res = await fetch("/api/v1/ingest/pdf", { method: "POST", body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || ("Xəta kodu " + res.status));
    const counts = Object.entries(data.element_counts).map(([k, v]) => `${k}: ${v}`).join(" · ");
    $("uploadResult").innerHTML =
      `<div class="report">✅ <b>${escapeHtml(data.document)}</b> indeksləndi.<br>
       Səhifə: <b>${data.pages}</b> · Chunk: <b>${data.chunks_indexed}</b><br>
       Elementlər: <span class="meta">${escapeHtml(counts)}</span></div>`;
    $("uploadResult").classList.remove("hidden");
    refreshHealth();
  } catch (err) {
    $("uploadResult").innerHTML = `<div class="error">❌ ${escapeHtml(err.message)}</div>`;
    $("uploadResult").classList.remove("hidden");
  } finally {
    btn.innerHTML = "Yüklə və İndekslə";
    btn.disabled = false;
  }
});

/* ---------- query ---------- */
$("queryBtn").addEventListener("click", async () => {
  const q = $("queryInput").value.trim();
  if (!q) { $("queryInput").focus(); return; }
  const btn = $("queryBtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Hazırlanır...';
  $("queryResult").classList.add("hidden");
  const payload = { query: q, top_k: parseInt($("topK").value, 10) || 5 };
  if ($("docFilter").value) payload.documents = [$("docFilter").value];
  try {
    const res = await fetch("/api/v1/query", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || ("Xəta kodu " + res.status));
    $("answerBox").innerHTML = highlightCitations(renderMarkdown(data.answer));
    $("citations").innerHTML = data.citations.length
      ? data.citations.map(c => `<span class="chip">${escapeHtml(c)}</span>`).join("")
      : "";
    $("sourcesList").innerHTML = data.sources.map((s, idx) => {
      const badgeCls = { table: "b-table", heading: "b-heading", text: "b-text" }[s.element_type] || "b-text";
      const label = s.element_type === "table" ? "Cədvəl" : s.element_type === "heading" ? "Başlıq" : "Mətn";
      const where = s.table_id != null ? `Səhifə ${s.page}, Cədvəl ${s.table_id}` : `Səhifə ${s.page}`;
      return `<li>
        <span class="badge ${badgeCls}">${label}</span>
        <strong>${where}</strong>
        <span class="meta">· ${escapeHtml(s.document)} · skor ${s.score.toFixed(3)}</span>
        <pre class="snippet">${escapeHtml(s.text)}</pre>
      </li>`;
    }).join("");
    $("queryResult").classList.remove("hidden");
  } catch (err) {
    $("answerBox").innerHTML = `<div class="error">❌ ${escapeHtml(err.message)}</div>`;
    $("queryResult").classList.remove("hidden");
    $("citations").innerHTML = "";
    $("sourcesList").innerHTML = "";
  } finally {
    btn.innerHTML = "Soruş";
    btn.disabled = false;
  }
});

/* ---------- init ---------- */
refreshHealth();
setInterval(refreshHealth, 15000);
</script>
</body>
</html>
